            config:
              - id: fs-local
                name: '@deepseek-ai/dsh-fs-local'
              - id: tool-fs
                name: '@deepseek-ai/dsh-tool-fs'
              - id: fs-search
                name: '@deepseek-ai/dsh-tool-fs-search'
                config:
                  sampleOverCapGlobResults: false
              - id: file-butler
                name: 'dsh-text-preset/file-butler'
              - id: doc-bridge
                name: 'dsh-text-preset/doc-bridge'
              - id: skill-filesystem
                name: '@deepseek-ai/dsh-skill-filesystem'
              - id: tool-skill
                name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: '计划模式：按【文档与工具准则】第 5 条执行，只交付写作提纲，不写正文、不改文件；提纲写清题目、分节、每节要点、所需依据是否已到手、预计篇幅，用户确认后再动笔。'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

    # 4. 文本模式 · 公文办公：固定为国企层级语态的公文办公人设
